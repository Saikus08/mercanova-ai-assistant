# Services: db (PostgreSQL + pgvector), ollama (local LLM), frontend (Vite dev server)
# and backend (FastAPI). The frontend proxies /api to the backend.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      # Source mounted for hot reload; the anonymous volume keeps the image's node_modules.
      - ./frontend:/app
      - /app/node_modules

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - DATASET_PATH=${DATASET_PATH:-/data/MercaNova_dataset_obligatorio_2.xlsx}
      # Passed through only when set (shell or .env); the defaults live in backend/app/config.py.
      - LLM_MODEL
      - LLM_TIMEOUT_SECONDS
      - LLM_TEMPERATURE
      - LLM_NUM_CTX
      - LLM_THINK
      - AGENT_MAX_STEPS
      - AGENT_HISTORY_MESSAGES
      - EMBEDDING_MODEL
      - EMBEDDING_TIMEOUT_SECONDS
      - EMBEDDING_BATCH_SIZE
      - SEARCH_MIN_SIMILARITY
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      # Course dataset (not versioned): copy the Excel into ./data before `make seed`.
      - ./data:/data:ro

volumes:
  db_data:
  ollama_data:
