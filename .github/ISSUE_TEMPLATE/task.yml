name: Tarea
description: Una unidad de trabajo del plan. También es el pedido que se le pasa al coding agent.
title: "[ID] "
body:
  - type: textarea
    id: context
    attributes:
      label: Contexto
      description: Qué existe hoy y por qué hace falta esta tarea.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Qué hay que hacer
    validations:
      required: true
  - type: textarea
    id: covers
    attributes:
      label: Para qué sirve
      description: Requerimiento de la letra explicado (por ejemplo, "Confirmación de compra (RF-12)") y puntos de la rúbrica.
  - type: textarea
    id: out_of_scope
    attributes:
      label: Fuera de alcance / qué no tocar
      description: Archivos, módulos o comportamientos que esta tarea no debe modificar.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Está terminado cuando
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: agent
    attributes:
      label: Cómo se trabaja
      description: Skill del coding agent a usar, cómo se testea y quién revisa el PR.
